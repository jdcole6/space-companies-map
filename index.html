<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Space Companies — Office Map</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --panel-bg: rgba(255,255,255,0.96);
    --text: #1a1a2e;
    --muted: #5a5a72;
    --border: #e2e2ee;
    --accent: #2b4eff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
  }
  #map { position: absolute; inset: 0; z-index: 0; background: #aadaff; }

  .panel {
    position: absolute;
    top: calc(12px + env(safe-area-inset-top, 0px));
    right: 12px;
    z-index: 1000;
    width: 260px;
    max-height: calc(100% - 24px - env(safe-area-inset-top, 0px));
    overflow-y: auto;
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.15);
    padding: 14px 16px;
    backdrop-filter: blur(6px);
  }
  .panel h1 { font-size: 15px; margin: 0 0 2px; }
  .panel .sub { font-size: 12px; color: var(--muted); margin: 0 0 12px; }
  .status { font-size: 12px; color: var(--muted); margin: 0 0 10px; }
  .section-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
    color: var(--muted); margin: 12px 0 6px; font-weight: 600;
  }
  .filter-row {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; padding: 3px 0; cursor: pointer;
  }
  .filter-row input { cursor: pointer; }
  .swatch { width: 12px; height: 12px; border-radius: 50%; flex: 0 0 auto; border: 1px solid rgba(0,0,0,0.2); }
  .filter-count { color: var(--muted); font-size: 11px; margin-left: auto; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    width: 100%; margin-top: 12px; padding: 8px 10px;
    font-size: 13px; font-weight: 600; color: #fff; background: var(--accent);
    border: none; border-radius: 8px; cursor: pointer;
  }
  .btn:disabled { opacity: .6; cursor: default; }
  .btn.secondary { background: #eef0ff; color: var(--accent); }

  .toggle-btn {
    position: absolute;
    top: calc(12px + env(safe-area-inset-top, 0px));
    right: 12px;
    z-index: 1001;
    display: none;
    padding: 8px 12px; font-size: 13px; font-weight: 600;
    background: var(--panel-bg); border: 1px solid var(--border);
    border-radius: 8px; box-shadow: 0 4px 14px rgba(0,0,0,0.15); cursor: pointer;
  }

  .popup-title { font-weight: 700; font-size: 14px; margin: 0 0 2px; }
  .popup-loc { color: var(--muted); font-size: 12px; margin: 0 0 6px; }
  .popup-meta { font-size: 12px; margin: 2px 0; }
  .popup-tag {
    display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px;
    background: #eef0ff; color: var(--accent); margin: 2px 0;
  }
  .popup-notes { font-size: 12px; color: #333; margin: 6px 0 0; }
  .popup-link { font-size: 12px; display: inline-block; margin-top: 8px; color: var(--accent); }
  .leaflet-popup-content { margin: 12px 14px; max-width: 230px; }

  @media (max-width: 640px) {
    .panel { width: calc(100% - 24px); max-width: 320px; display: none; }
    .panel.open { display: block; }
    .toggle-btn { display: block; }
    .panel.open + .toggle-btn { display: none; }
  }
</style>
</head>
<body>
<div id="map"></div>

<button class="toggle-btn" id="toggleBtn" aria-label="Show filters">☰ Filters</button>

<div class="panel" id="panel">
  <h1>Space Companies</h1>
  <p class="sub">Office locations — live from your database</p>
  <p class="status" id="status">Loading…</p>

  <div id="filters"></div>

  <button class="btn" id="refreshBtn">↻ Refresh data</button>
  <button class="btn secondary" id="closeBtn" style="display:none;">Close</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // ---- Your Supabase project (public, read-only) ----
  const SUPABASE_URL = "https://ffgpmmaklsxktmircrlt.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZmZ3BtbWFrbHN4a3RtaXJjcmx0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4MzczMzgsImV4cCI6MjEwNTQxMzMzOH0.bODYQ4QvgPhauJ_uFeWkFBnG6lnlqH6oP2h6hxv0cI4";
  // This is the public anon key. It's safe to publish: the offices table is locked to read-only for it.

  const PALETTE = ["#e6194B","#3cb44b","#4363d8","#f58231","#911eb4","#42d4f4",
                   "#f032e6","#469990","#9A6324","#800000","#000075","#808000"];

  if (typeof L === "undefined") {
    document.getElementById("status").textContent =
      "Map library failed to load — check your connection and reload.";
    throw new Error("Leaflet (L) failed to load from CDN");
  }

  const map = L.map("map", { zoomControl: true }).setView([39.5, -98.35], 4);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);

  const statusEl = document.getElementById("status");
  const filtersEl = document.getElementById("filters");
  const refreshBtn = document.getElementById("refreshBtn");

  let layerGroup = L.layerGroup().addTo(map);
  let allRows = [];
  let colorByCompany = {};
  const activeCompanies = new Set();

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, c => (
      {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]
    ));
  }

  async function loadData() {
    refreshBtn.disabled = true;
    statusEl.textContent = "Loading…";
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/offices?select=*&order=company,state_region,city`, {
        headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      allRows = await res.json();

      const companies = [...new Set(allRows.map(r => r.company).filter(Boolean))].sort();
      colorByCompany = {};
      companies.forEach((c, i) => { colorByCompany[c] = PALETTE[i % PALETTE.length]; });
      if (activeCompanies.size === 0) companies.forEach(c => activeCompanies.add(c));

      buildFilters(companies);
      render();
    } catch (err) {
      statusEl.textContent = "Couldn't load data: " + err.message;
    } finally {
      refreshBtn.disabled = false;
    }
  }

  function buildFilters(companies) {
    const counts = {};
    allRows.forEach(r => { counts[r.company] = (counts[r.company] || 0) + 1; });
    let html = '<div class="section-label">Companies</div>';
    companies.forEach(c => {
      const checked = activeCompanies.has(c) ? "checked" : "";
      html += `<label class="filter-row">
        <input type="checkbox" data-company="${esc(c)}" ${checked}/>
        <span class="swatch" style="background:${colorByCompany[c]}"></span>
        <span>${esc(c)}</span>
        <span class="filter-count">${counts[c] || 0}</span>
      </label>`;
    });
    filtersEl.innerHTML = html;
    filtersEl.querySelectorAll("input[type=checkbox]").forEach(cb => {
      cb.addEventListener("change", () => {
        const c = cb.getAttribute("data-company");
        if (cb.checked) activeCompanies.add(c); else activeCompanies.delete(c);
        render();
      });
    });
  }

  function render() {
    layerGroup.clearLayers();
    const shown = allRows.filter(r =>
      activeCompanies.has(r.company) &&
      r.latitude != null && r.longitude != null
    );
    const bounds = [];
    shown.forEach(r => {
      const lat = parseFloat(r.latitude), lng = parseFloat(r.longitude);
      if (isNaN(lat) || isNaN(lng)) return;
      const marker = L.circleMarker([lat, lng], {
        radius: 7,
        color: "#fff", weight: 1.5,
        fillColor: colorByCompany[r.company] || "#666",
        fillOpacity: 0.9
      });
      const careers = r.careers_url
        ? `<a class="popup-link" href="${esc(r.careers_url)}" target="_blank" rel="noopener">View careers &rarr;</a>` : "";
      const notes = r.notes ? `<p class="popup-notes">${esc(r.notes)}</p>` : "";
      const type = r.location_type ? `<span class="popup-tag">${esc(r.location_type)}</span>` : "";
      marker.bindPopup(
        `<p class="popup-title">${esc(r.company)}</p>
         <p class="popup-loc">${esc(r.city)}, ${esc(r.state_region)}</p>
         ${type}
         <p class="popup-meta">${esc(r.division || "")}</p>
         ${notes}${careers}`
      );
      marker.addTo(layerGroup);
      bounds.push([lat, lng]);
    });

    const total = allRows.length;
    statusEl.textContent = `Showing ${shown.length} of ${total} office${total === 1 ? "" : "s"}`;
    if (bounds.length) map.fitBounds(bounds, { padding: [50, 50], maxZoom: 8 });
  }

  refreshBtn.addEventListener("click", loadData);

  // Mobile panel toggle
  const panel = document.getElementById("panel");
  const toggleBtn = document.getElementById("toggleBtn");
  const closeBtn = document.getElementById("closeBtn");
  toggleBtn.addEventListener("click", () => { panel.classList.add("open"); });
  closeBtn.addEventListener("click", () => { panel.classList.remove("open"); });
  function syncCloseBtn() { closeBtn.style.display = window.innerWidth <= 640 ? "block" : "none"; }
  window.addEventListener("resize", syncCloseBtn); syncCloseBtn();

  loadData();
</script>
</body>
</html>
